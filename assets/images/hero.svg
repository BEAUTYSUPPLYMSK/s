<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="1440" height="600" role="img" aria-label="Декоративный фон">
  <defs>
    <!-- Elegant Rose Quartz & Cream Gradients -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5F3"/>
      <stop offset="30%" stop-color="#F5F3FA"/>
      <stop offset="60%" stop-color="#F9F0ED"/>
      <stop offset="100%" stop-color="#FBF5F3"/>
    </linearGradient>
    
    <!-- Subtle Rose Glow -->
    <radialGradient id="hero-glow-rose" cx="85%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#C4917B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F5F3FA" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Soft Lavender Accent -->
    <radialGradient id="hero-glow-lavender" cx="15%" cy="75%" r="35%">
      <stop offset="0%" stop-color="#B8A5C4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FAF5F3" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Subtle Pattern -->
    <pattern id="hero-pattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1" fill="#C4917B" fill-opacity="0.06"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="600" fill="url(#hero-bg)"/>
  <rect width="1440" height="600" fill="url(#hero-glow-rose)"/>
  <rect width="1440" height="600" fill="url(#hero-glow-lavender)"/>
  <rect width="1440" height="600" fill="url(#hero-pattern)"/>
  
  <!-- Decorative Circles -->
  <circle cx="1250" cy="150" r="200" fill="none" stroke="#C4917B" stroke-width="1" stroke-opacity="0.1"/>
  <circle cx="1250" cy="150" r="280" fill="none" stroke="#C4917B" stroke-width="0.5" stroke-opacity="0.08"/>
  <circle cx="1250" cy="150" r="360" fill="none" stroke="#C4917B" stroke-width="0.5" stroke-opacity="0.05"/>
  
  <circle cx="180" cy="450" r="160" fill="none" stroke="#B8A5C4" stroke-width="1" stroke-opacity="0.1"/>
  <circle cx="180" cy="450" r="240" fill="none" stroke="#B8A5C4" stroke-width="0.5" stroke-opacity="0.08"/>
  
  <!-- Elegant Lines -->
  <line x1="0" y1="150" x2="600" y2="150" stroke="#C4917B" stroke-width="0.5" stroke-opacity="0.05"/>
  <line x1="0" y1="300" x2="400" y2="300" stroke="#B8A5C4" stroke-width="0.5" stroke-opacity="0.05"/>
  <line x1="840" y1="600" x2="1440" y2="600" stroke="#C4917B" stroke-width="0.5" stroke-opacity="0.05"/>
  <line x1="1040" y1="600" x2="1440" y2="600" stroke="#B8A5C4" stroke-width="0.5" stroke-opacity="0.05"/>
</svg>
