<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена (404) — Интернет-магазин Beauty Supply</title>
  <meta name="description" content="Запрашиваемая страница не найдена (ошибка 404). Перейдите в каталог премиальной уходовой и декоративной косметики из США интернет-магазина Beauty Supply.">
  <meta name="robots" content="noindex, follow">
  <base href="https://beautysupplymsk.github.io/s/">
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
  <!-- TODO: вставить код счётчика Яндекс.Метрики или Google Analytics -->
  <!-- Инструкция: https://metrika.yandex.ru/ -->
  <style>
    :root{--accent:#C4917B;--primary:#2D2438;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter','Segoe UI',Arial,sans-serif;background:#FDFBF9;color:var(--primary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;}
    .code{font-size:clamp(80px,18vw,160px);font-family:Georgia,serif;color:var(--accent);line-height:1;margin-bottom:16px;font-weight:600;}
    h1{font-size:clamp(22px,5vw,34px);margin:0 0 16px;font-weight:600;}
    p{color:#6b5f6e;max-width:520px;margin:0 auto 28px;line-height:1.6;}
    .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
    a.btn{display:inline-block;padding:13px 26px;border-radius:10px;text-decoration:none;font-weight:600;font-size:16px;}
    a.primary{background:var(--accent);color:#fff;}
    a.ghost{background:transparent;color:var(--primary);border:2px solid #E2D6CE;}
    .brand{margin-top:34px;font-family:Georgia,serif;letter-spacing:2px;color:var(--primary);font-size:18px;}
    .brand b{color:var(--accent);}
    #cookie-banner{position:fixed;bottom:16px;left:16px;right:16px;max-width:520px;margin:0 auto;z-index:1000;background:#ffffff;color:#2D2438;border:1px solid #EDE8E3;border-radius:12px;padding:16px 24px;box-shadow:0 12px 32px rgba(45,36,56,0.08);display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:14px;text-align:left;}
    #cookie-banner[hidden]{display:none!important;}
    #cookie-banner p{margin:0;color:#5C5060;line-height:1.5;}
    #cookie-banner a{color:#8A5E50;text-decoration:underline;}
    #cookie-accept{background:#C4917B;color:#ffffff;border:none;border-radius:6px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;}
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>К сожалению, запрашиваемая страница не существует или была перемещена. Вернитесь в каталог премиальной косметики из США.</p>
    <div class="btns">
      <a class="btn primary" href="./index.html">На главную</a>
      <a class="btn ghost" href="./pages/catalog.html">В каталог</a>
    </div>
    <div class="brand">BEAUTY<b>SUPPLY</b></div>
  </main>

  <!-- Баннер согласия на использование cookies (152-ФЗ) -->
  <div id="cookie-banner" role="dialog" aria-live="polite" aria-label="Уведомление о cookies" hidden>
    <p>Мы используем cookies для корректной работы сайта.
       <a href="./pages/legal/privacy.html">Политика конфиденциальности</a></p>
    <button id="cookie-accept" type="button">Принять</button>
  </div>
  <script>
    // Инициализация баннера согласия на cookies
    (function () {
      var banner = document.getElementById('cookie-banner');
      var btn = document.getElementById('cookie-accept');
      if (!banner || !btn) return;
      try {
        if (!localStorage.getItem('cookies_accepted')) {
          banner.removeAttribute('hidden');
        }
      } catch (err) {
        banner.removeAttribute('hidden');
      }
      btn.addEventListener('click', function () {
        try { localStorage.setItem('cookies_accepted', '1'); } catch (err) {}
        banner.setAttribute('hidden', '');
      });
    }());
  </script>
</body>
</html>
