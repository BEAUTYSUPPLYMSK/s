  <!-- Баннер согласия на использование cookies (152-ФЗ) -->
  <div id="cookie-banner" role="dialog" aria-live="polite" aria-label="Уведомление о cookies" hidden>
    <p>Мы используем cookies для корректной работы сайта.
       <a href="./legal/privacy.html">Политика конфиденциальности</a></p>
    <button id="cookie-accept" type="button">Принять</button>
  </div>
  <script>
    // Инициализация баннера согласия на cookies
    (function () {
      var banner = document.getElementById('cookie-banner');
      var btn = document.getElementById('cookie-accept');
      if (!localStorage.getItem('cookies_accepted')) {
        banner.removeAttribute('hidden');
      }
      btn.addEventListener('click', function () {
        localStorage.setItem('cookies_accepted', '1');
        banner.setAttribute('hidden', '');
      });
    }());
  </script>
