<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Индивидуальный Предзаказ — Beauty Supply</title>
  <meta name="description" content="Оформление индивидуального предзаказа редкой уходовой и декоративной косметики из США.">
  
  <link rel="canonical" href="https://beautysupplymsk.github.io/s/pages/preorder.html">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../styles/main.css">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://beautysupplymsk.github.io/s/pages/preorder.html">
  <meta property="og:title" content="Индивидуальный Предзаказ — Beauty Supply">
  <meta property="og:description" content="Премиальная косметика из США: Image Skincare, Charlotte Tilbury, Hourglass. 100% оригинал.">
  <meta property="og:image" content="https://beautysupplymsk.github.io/s/assets/images/og-default.svg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Индивидуальный Предзаказ — Beauty Supply">
  <meta name="twitter:description" content="100% оригинальная косметика из США в России.">
  <meta name="twitter:image" content="https://beautysupplymsk.github.io/s/assets/images/og-default.svg">
</head>
<body>
  <a href="#main-content" class="skip-link">Перейти к основному содержимому</a>

  <header id="site-header" class="site-header"></header>

  <main id="main-content" class="section">
    <div class="container" style="max-width: 700px;">
      <nav aria-label="Хлебные крошки" style="margin-bottom: var(--space-6); font-size: var(--text-xs); color: var(--color-muted);">
        <a href="../index.html">Главная</a> &gt; <span style="color: var(--color-primary); font-weight: 600;">Предзаказ</span>
      </nav>

      <span class="badge" style="margin-bottom: var(--space-4);">Персональный сервис</span>
      <h1 style="margin-bottom: var(--space-4);">Индивидуальный предзаказ из США</h1>
      <p style="color: var(--color-secondary); margin-bottom: var(--space-8);">
        Ищете специфический оттенок, лимитированный набор или средство, которого нет в каталоге? Заполните форму — мы выкупим его напрямую в США и доставим вам.
      </p>

      <form id="preorder-form" style="background: var(--color-surface); padding: var(--space-8); border-radius: var(--radius-md); border: 1px solid var(--color-border); display: flex; flex-direction: column; gap: var(--space-5);">
        
        <div>
          <label for="form-name" style="display: block; font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; margin-bottom: var(--space-1);">Ваше Имя *</label>
          <input type="text" id="form-name" required placeholder="Анна" style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm);">
        </div>

        <div>
          <label for="form-contact" style="display: block; font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; margin-bottom: var(--space-1);">Telegram ник или телефон *</label>
          <input type="text" id="form-contact" required placeholder="@username или +7 (999) 000-00-00" style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm);">
        </div>

        <div>
          <label for="form-product" style="display: block; font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; margin-bottom: var(--space-1);">Интересующий товар / бренд *</label>
          <input type="text" id="form-product" required placeholder="Например: Charlotte Tilbury Pillow Talk Medium Lipstick" style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm);">
        </div>

        <div>
          <label for="form-comment" style="display: block; font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; margin-bottom: var(--space-1);">Комментарий / Уточнение (необязательно)</label>
          <textarea id="form-comment" rows="3" placeholder="Укажите желаемый объем, оттенок или срочность..." style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font: inherit;"></textarea>
        </div>

        <div style="display: flex; align-items: flex-start; gap: var(--space-2); font-size: var(--text-xs); color: var(--color-muted);">
          <input type="checkbox" id="form-consent" required style="margin-top: 3px;">
          <label for="form-consent">
            Я согласен(а) на обработку персональных данных в соответствии с <a href="legal/privacy.html" style="text-decoration: underline;" target="_blank">Политикой конфиденциальности</a>.
          </label>
        </div>

        <button type="submit" class="btn btn-accent btn-lg" style="margin-top: var(--space-2);">
          Отправить заявку в Telegram →
        </button>

      </form>

    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../scripts/components.js"></script>
  <script src="../scripts/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNav('preorder');
      renderFooter();

      // Pre-fill product if query param exists
      const initialProduct = getQueryParam('product');
      if (initialProduct) {
        const prodInput = document.getElementById('form-product');
        if (prodInput) prodInput.value = initialProduct;
      }

      const form = document.getElementById('preorder-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = document.getElementById('form-name').value;
          const contact = document.getElementById('form-contact').value;
          const product = document.getElementById('form-product').value;
          const comment = document.getElementById('form-comment').value;

          const text = encodeURIComponent(`Здравствуйте! Заявка на предзаказ:\n• Имя: ${name}\n• Контакт: ${contact}\n• Товар: ${product}\n• Комментарий: ${comment || '—'}`);
          
          window.open(`https://t.me/BEAUTYSUPPLYMSKBOT?start=preorder_${encodeURIComponent(product.substring(0, 20))}`, '_blank');
        });
      }
    });
  </script>
</body>
</html>
