<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отзывы клиентов — Beauty Supply</title>
  <meta name="description" content="Реальные отзывы покупателей Beauty Supply с Авито и социальных сетей. 100% проверенная репутация.">
  
  <link rel="canonical" href="https://beautysupplymsk.github.io/s/pages/reviews.html">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../styles/main.css">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://beautysupplymsk.github.io/s/pages/reviews.html">
  <meta property="og:title" content="Отзывы клиентов — Beauty Supply">
  <meta property="og:description" content="Премиальная косметика из США: Image Skincare, Charlotte Tilbury, Hourglass. 100% оригинал.">
  <meta property="og:image" content="https://beautysupplymsk.github.io/s/assets/images/og-default.svg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Отзывы клиентов — Beauty Supply">
  <meta name="twitter:description" content="100% оригинальная косметика из США в России.">
  <meta name="twitter:image" content="https://beautysupplymsk.github.io/s/assets/images/og-default.svg">
</head>
<body>
  <a href="#main-content" class="skip-link">Перейти к основному содержимому</a>

  <header id="site-header" class="site-header"></header>

  <main id="main-content" class="section">
    <div class="container">
      <nav aria-label="Хлебные крошки" style="margin-bottom: var(--space-6); font-size: var(--text-xs); color: var(--color-muted);">
        <a href="../index.html">Главная</a> &gt; <span style="color: var(--color-primary); font-weight: 600;">Отзывы</span>
      </nav>

      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: var(--space-10); flex-wrap: wrap; gap: var(--space-4);">
        <div>
          <span class="badge">Доверие клиентов</span>
          <h1 style="margin-top: var(--space-2);">Отзывы о нашей работе</h1>
        </div>
        <a href="https://www.avito.ru/user/7d5cc17e554a6f4d901ec51bdd907f7b/profile" target="_blank" rel="noopener noreferrer" class="btn btn-accent btn-sm">
          ⭐ Открыть профиль на Авито (33 отзыва) ↗
        </a>
      </div>

      <!-- Trust Stats Banner -->
      <div style="background: var(--color-surface); border: 1px solid var(--color-border); padding: var(--space-8); border-radius: var(--radius-md); margin-bottom: var(--space-10);">
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); text-align: center;">
          <div>
            <div style="font-size: var(--text-3xl); font-weight: 700; color: var(--color-accent-dark);">5.0</div>
            <div style="font-size: var(--text-xs); color: var(--color-muted);">Средняя оценка на Авито</div>
          </div>
          <div>
            <div style="font-size: var(--text-3xl); font-weight: 700; color: var(--color-primary);">33</div>
            <div style="font-size: var(--text-xs); color: var(--color-muted);">Подтвержденных отзыва</div>
          </div>
          <div>
            <div style="font-size: var(--text-3xl); font-weight: 700; color: var(--color-primary);">23</div>
            <div style="font-size: var(--text-xs); color: var(--color-muted);">Сделки Авито Доставкой</div>
          </div>
          <div>
            <div style="font-size: var(--text-3xl); font-weight: 700; color: var(--color-primary);">120+</div>
            <div style="font-size: var(--text-xs); color: var(--color-muted);">Отзывов во всех каналах</div>
          </div>
        </div>
      </div>

      <!-- Reviews Grid -->
      <div id="all-reviews-grid" class="grid" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); margin-bottom: var(--space-12);">
        <!-- JS Loaded -->
      </div>

    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../scripts/components.js"></script>
  <script src="../scripts/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNav('reviews');
      renderFooter();

      fetch('../assets/data/reviews.json')
        .then(res => res.json())
        .then(reviews => {
          const container = document.getElementById('all-reviews-grid');
          if (container) {
            container.innerHTML = reviews.map(r => renderReviewCard(r)).join('');
          }
        })
        .catch(err => console.error('Error loading reviews:', err));
    });
  </script>
</body>
</html>
