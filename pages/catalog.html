<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="canonical" href="https://beautysupplymsk.github.io/s/pages/catalog.html">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../styles/main.css">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://beautysupplymsk.github.io/s/pages/catalog.html">
  <meta property="og:title" content="Каталог оригинальной косметики из США — Beauty Supply">
  <meta property="og:description" content="Каталог премиальной косметики из США: Image Skincare, Charlotte Tilbury, Hourglass. 100% оригинал в наличии в Москве с быстрой доставкой по всей России.">
  <meta property="og:image" content="https://beautysupplymsk.github.io/s/assets/images/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Каталог оригинальной косметики из США — Beauty Supply">
  <meta name="twitter:description" content="Каталог премиальной косметики из США: Image Skincare, Charlotte Tilbury, Hourglass. 100% оригинал в наличии в Москве с быстрой доставкой по всей России.">
  <meta name="twitter:image" content="https://beautysupplymsk.github.io/s/assets/images/og-default.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap">
  </head>
<body>
  <a href="#main-content" class="skip-link">Перейти к основному содержимому</a>

  <header id="site-header" class="site-header"></header>

  <main id="main-content" class="section">
    <div class="container">
      
      <!-- Catalog Header -->
      <div style="margin-bottom: var(--space-8);">
        <nav aria-label="Хлебные крошки" style="margin-bottom: var(--space-4); font-size: var(--text-sm); color: var(--color-muted);">
          <a href="../index.html" style="color: var(--color-accent-dark);">Главная</a> 
          <span aria-hidden="true"> › </span>
          <span style="color: var(--color-primary); font-weight: 600;">Каталог</span>
        </nav>
        <h1>Каталог премиальной косметики</h1>
        <p style="color: var(--color-secondary); margin-top: var(--space-2);">100% оригинальная продукция брендов Image Skincare, Charlotte Tilbury и Hourglass из США.</p>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-4); align-items: end;">
          
          <div class="form-group" style="margin-bottom: 0;">
            <label for="filter-brand" class="form-label">Бренд</label>
            <select id="filter-brand" class="form-select">
              <option value="">Все бренды</option>
              <option value="Image Skincare">Image Skincare</option>
              <option value="Charlotte Tilbury">Charlotte Tilbury</option>
              <option value="Hourglass">Hourglass</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="filter-category" class="form-label">Категория</label>
            <select id="filter-category" class="form-select">
              <option value="">Все категории</option>
              <option value="face-care">Уход за лицом</option>
              <option value="body-care">Уход за телом</option>
              <option value="spf">Солнцезащита SPF</option>
              <option value="makeup">Декоративная косметика</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="filter-goal" class="form-label">Назначение</label>
            <select id="filter-goal" class="form-select">
              <option value="">Все назначение</option>
              <option value="anti-age">Anti-age & Омоложение</option>
              <option value="lifting">Лифтинг & Плотность</option>
              <option value="spf">Защита SPF</option>
              <option value="glow">Сияние & Тон</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="filter-search" class="form-label">Поиск</label>
            <input type="text" id="filter-search" placeholder="Поиск по названию..." class="form-input">
          </div>

        </div>

        <div class="filter-actions">
          <span id="catalog-count" aria-live="polite">Загрузка каталога...</span>
          <span>💬 <a href="https://t.me/BEAUTYSUPPLYMSKBOT" target="_blank" rel="noopener noreferrer" style="color: var(--color-accent-dark);">Заказать через Telegram</a></span>
        </div>
      </div>

      <!-- Products Grid -->
      <h2 class="sr-only">Список товаров</h2>
      <div id="catalog-products-grid" class="grid" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));">
        <!-- JS Hydrated -->
      </div>

    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../scripts/components.js"></script>
  <script src="../scripts/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNav('catalog');
      renderFooter();
      initCatalogPage();
    });
  </script>
</body>
</html>
